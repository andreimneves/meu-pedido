<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe do Pedido - Meu Pedido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-header">
        <h1>🍽️ Meu Pedido - Painel Administrativo</h1>
        <div class="user-info">
            <span>👤 DL Crepes e Lanches</span>
            <button class="logout" onclick="logout()">🚪 Sair</button>
        </div>
    </div>
    
    <div class="admin-container">
        <div class="admin-sidebar">
            <ul>
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="pedidos.html">📋 Pedidos</a></li>
                <li><a href="config.html">⚙️ Configurações</a></li>
                <li><a href="categorias.html">📁 Categorias</a></li>
                <li><a href="produtos.html">📦 Produtos</a></li>
                <li><a href="complementos.html">🧩 Complementos</a></li>
            </ul>
        </div>
        
        <div class="admin-content">
            <button class="btn-voltar" onclick="window.location.href='pedidos.html'">← Voltar para Pedidos</button>
            
            <div id="pedidoContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Carregando detalhes do pedido...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal WhatsApp -->
    <div id="whatsappModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('whatsappModal').style.display='none'">&times;</span>
            <h2>📱 Enviar via WhatsApp</h2>
            <input type="text" id="whatsappNumero" placeholder="Digite o número (com DDD)" value="55">
            <button class="btn-save" onclick="enviarWhatsApp()">Enviar Pedido</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://meu-pedido-backend.onrender.com/api';
        const SUBDOMINIO = 'dlcrepes';
        
        let pedidoAtual = null;
        let configuracoesLoja = {};

        // Verificar login
        if (!localStorage.getItem('adminLogado')) {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('adminLogado');
            window.location.href = 'index.html';
        }

        function getParametroId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        function extrairCep(endereco) {
            if (!endereco) return null;
            // Procura por padrões de CEP: 00000-000 ou 00000000
            const match = endereco.match(/\b(\d{5}-?\d{3})\b/);
            return match ? match[1] : null;
        }

        async function carregarPedido() {
            const pedidoId = getParametroId();
            
            if (!pedidoId) {
                document.getElementById('pedidoContainer').innerHTML = `
                    <div style="text-align:center; padding:40px; color:red;">
                        ❌ ID do pedido não encontrado
                    </div>
                `;
                return;
            }

            try {
                console.log(`🔄 Carregando pedido #${pedidoId}...`);
                
                // Carregar configurações da loja (para o WhatsApp)
                const configResponse = await fetch(`${API_URL}/config/${SUBDOMINIO}`);
                configuracoesLoja = await configResponse.json();
                
                // Carregar pedido
                const response = await fetch(`${API_URL}/pedidos/${SUBDOMINIO}/${pedidoId}`);
                
                if (!response.ok) {
                    throw new Error('Pedido não encontrado');
                }
                
                pedidoAtual = await response.json();
                console.log('✅ Pedido carregado:', pedidoAtual);
                
                exibirPedido();
                
            } catch (error) {
                console.error('❌ Erro:', error);
                document.getElementById('pedidoContainer').innerHTML = `
                    <div style="text-align:center; padding:40px; color:red;">
                        ❌ Erro ao carregar pedido: ${error.message}
                    </div>
                `;
            }
        }

        function formatarData(data) {
            return new Date(data).toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function exibirPedido() {
            const p = pedidoAtual;
            const dataFormatada = formatarData(p.data_pedido);
            
            const enderecoCompleto = p.cliente_endereco || '';
            const bairro = p.cliente_bairro || '';
            const cep = p.cliente_cep || extrairCep(enderecoCompleto) || 'Não informado';
            
            // Gerar HTML dos itens
            const itensHtml = p.itens.map(item => `
                <tr>
                    <td>${item.produto_nome}</td>
                    <td>${item.quantidade}</td>
                    <td>R$ ${parseFloat(item.preco_unitario).toFixed(2)}</td>
                    <td>R$ ${parseFloat(item.subtotal).toFixed(2)}</td>
                </tr>
            `).join('');

            const html = `
                <div class="pedido-card" id="pedidoParaImprimir">
                    <div class="pedido-header">
                        <div class="pedido-id">
                            <span>#</span>${p.id}
                        </div>
                        <div class="pedido-status status-${p.status}">
                            ${p.status.toUpperCase()}
                        </div>
                    </div>
                    
                    <div class="pedido-data">
                        📅 ${dataFormatada}
                    </div>

                    <div class="secao">
                        <h2>👤 Cliente</h2>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Nome</div>
                                <div class="info-value">${p.cliente_nome}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Telefone</div>
                                <div class="info-value">${p.cliente_telefone}</div>
                            </div>
                        </div>
                    </div>

                    ${p.tipo_entrega === 'delivery' ? `
                        <div class="secao">
                            <h2>📍 Endereço de Entrega</h2>
                            <div class="info-grid">
                                <div class="info-item" style="grid-column: span 2;">
                                    <div class="info-label">Endereço Completo</div>
                                    <div class="info-value">${enderecoCompleto}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Bairro</div>
                                    <div class="info-value">${bairro}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">CEP</div>
                                    <div class="info-value">${cep}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Tipo</div>
                                    <div class="info-value">🚚 Delivery</div>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="secao">
                            <h2>🏠 Retirada</h2>
                            <div class="info-item">
                                <div class="info-value">Cliente retirará no local</div>
                            </div>
                        </div>
                    `}

                    <div class="secao">
                        <h2>📋 Itens do Pedido</h2>
                        <table class="itens-tabela">
                            <thead>
                                <tr>
                                    <th>Produto</th>
                                    <th>Qtd</th>
                                    <th>Preço Unit.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itensHtml}
                            </tbody>
                        </table>

                        <div class="total-pedido">
                            <span class="total-label">Subtotal:</span>
                            <span class="total-value">R$ ${parseFloat(p.subtotal).toFixed(2)}</span>
                        </div>
                        
                        ${p.tipo_entrega === 'delivery' && p.taxa_entrega > 0 ? `
                            <div class="total-pedido">
                                <span class="total-label">Taxa de entrega:</span>
                                <span class="total-value">R$ ${parseFloat(p.taxa_entrega).toFixed(2)}</span>
                            </div>
                        ` : ''}
                        
                        <div class="total-pedido">
                            <span class="total-label">TOTAL:</span>
                            <span class="total-value">R$ ${parseFloat(p.total).toFixed(2)}</span>
                        </div>
                    </div>

                    ${p.observacoes ? `
                        <div class="secao">
                            <h2>📝 Observações</h2>
                            <div class="info-item">
                                <div class="info-value">${p.observacoes}</div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="acoes">
                        <button class="btn btn-primary" onclick="window.print()">
                            🖨️ Imprimir Pedido
                        </button>
                        <button class="btn btn-success" onclick="abrirModalWhatsApp()">
                            📱 Enviar via WhatsApp
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('pedidoContainer').innerHTML = html;
        }

        function abrirModalWhatsApp() {
            document.getElementById('whatsappModal').style.display = 'block';
        }

        function formatarMensagemWhatsApp() {
            const p = pedidoAtual;
            const cep = p.cliente_cep || extrairCep(p.cliente_endereco) || 'Não informado';
            
            let mensagem = `🍽️ *PEDIDO #${p.id}*\n`;
            mensagem += `━━━━━━━━━━━━━━━━━━━━━\n\n`;
            mensagem += `👤 *Cliente:* ${p.cliente_nome}\n`;
            mensagem += `📱 *Contato:* ${p.cliente_telefone}\n`;
            mensagem += `📅 *Data:* ${formatarData(p.data_pedido)}\n\n`;
            
            mensagem += `📋 *ITENS DO PEDIDO:*\n`;
            mensagem += `━━━━━━━━━━━━━━━━━━━━━\n`;
            
            p.itens.forEach(item => {
                mensagem += `• ${item.produto_nome}\n`;
                mensagem += `  ${item.quantidade}x R$ ${parseFloat(item.preco_unitario).toFixed(2)} = R$ ${parseFloat(item.subtotal).toFixed(2)}\n`;
            });
            
            mensagem += `━━━━━━━━━━━━━━━━━━━━━\n`;
            mensagem += `💰 *Subtotal:* R$ ${parseFloat(p.subtotal).toFixed(2)}\n`;
            
            if (p.tipo_entrega === 'delivery' && p.taxa_entrega > 0) {
                mensagem += `🚚 *Taxa de entrega:* R$ ${parseFloat(p.taxa_entrega).toFixed(2)}\n`;
            }
            
            mensagem += `💵 *TOTAL:* R$ ${parseFloat(p.total).toFixed(2)}\n\n`;
            
            if (p.tipo_entrega === 'delivery') {
                mensagem += `📍 *ENDEREÇO DE ENTREGA:*\n`;
                mensagem += `${p.cliente_endereco}\n`;
                if (p.cliente_bairro) mensagem += `Bairro: ${p.cliente_bairro}\n`;
                mensagem += `CEP: ${cep}\n`;
            } else {
                mensagem += `🏠 *RETIRADA NO LOCAL*\n`;
            }
            
            if (p.observacoes) {
                mensagem += `\n📝 *Observações:*\n${p.observacoes}\n`;
            }
            
            return encodeURIComponent(mensagem);
        }

        function enviarWhatsApp() {
            const numero = document.getElementById('whatsappNumero').value.replace(/\D/g, '');
            
            if (!numero || numero.length < 10) {
                alert('Digite um número válido com DDD');
                return;
            }
            
            const mensagem = formatarMensagemWhatsApp();
            const numeroFormatado = numero.includes('55') ? numero : `55${numero}`;
            
            window.open(`https://wa.me/${numeroFormatado}?text=${mensagem}`, '_blank');
            document.getElementById('whatsappModal').style.display = 'none';
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('whatsappModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        // Iniciar
        carregarPedido();
    </script>
</body>
</html>
