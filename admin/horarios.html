<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Painel - Horários</title>

<style>

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

button{
padding:6px 10px;
cursor:pointer;
}

</style>

</head>

<body>


<h1>Painel de Horários</h1>

<button onclick="fecharLoja()">
🔴 Fechar loja agora
</button>


<br><br>


<table>

<thead>

<tr>

<th>Dia</th>

<th>Loja aberta</th>
<th>Abre</th>
<th>Fecha</th>

<th>Delivery aberto</th>
<th>Delivery abre</th>
<th>Delivery fecha</th>

<th>Ação</th>

</tr>

</thead>


<tbody id="horariosTable">

<tr>
<td colspan="8">Carregando...</td>
</tr>

</tbody>

</table>


<script>

const dias=[
'Domingo',
'Segunda',
'Terça',
'Quarta',
'Quinta',
'Sexta',
'Sábado'
]


async function carregarHorarios(){

try{

const res = await fetch('/admin/horarios')

const data = await res.json()

const table = document.getElementById('horariosTable')

table.innerHTML=''


data.forEach(h=>{

table.innerHTML+=`

<tr>

<td>${dias[h.dia_semana]}</td>

<td>
<input type="checkbox"
id="aberto_${h.id}"
${h.aberto?'checked':''}>
</td>

<td>
<input type="time"
id="abre_${h.id}"
value="${h.abre}">
</td>

<td>
<input type="time"
id="fecha_${h.id}"
value="${h.fecha}">
</td>

<td>
<input type="checkbox"
id="delivery_aberto_${h.id}"
${h.delivery_aberto?'checked':''}>
</td>

<td>
<input type="time"
id="delivery_abre_${h.id}"
value="${h.delivery_abre}">
</td>

<td>
<input type="time"
id="delivery_fecha_${h.id}"
value="${h.delivery_fecha}">
</td>

<td>

<button onclick="salvarHorario(${h.id})">
Salvar
</button>

</td>

</tr>

`

})

}catch(err){

document.getElementById('horariosTable').innerHTML=
'<tr><td colspan="8">Erro ao carregar horários</td></tr>'

}

}



async function salvarHorario(id){

const aberto = document.getElementById(`aberto_${id}`).checked

const abre = document.getElementById(`abre_${id}`).value

const fecha = document.getElementById(`fecha_${id}`).value

const delivery_aberto = document.getElementById(`delivery_aberto_${id}`).checked

const delivery_abre = document.getElementById(`delivery_abre_${id}`).value

const delivery_fecha = document.getElementById(`delivery_fecha_${id}`).value



await fetch(`/admin/horarios/${id}`,{

method:'PUT',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

aberto,
abre,
fecha,
delivery_aberto,
delivery_abre,
delivery_fecha

})

})

alert('Horário atualizado!')

}



async function fecharLoja(){

await fetch('/admin/fechar-loja',{

method:'POST'

})

alert('Loja fechada!')

carregarHorarios()

}


carregarHorarios()

</script>

</body>
</html>
