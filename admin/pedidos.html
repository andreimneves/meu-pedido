<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Meu Pedido</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-novo { background: #ff9800; color: white; padding: 3px 8px; border-radius: 12px; }
        .status-preparando { background: #2196F3; color: white; padding: 3px 8px; border-radius: 12px; }
        .status-pronto { background: #4CAF50; color: white; padding: 3px 8px; border-radius: 12px; }
        .status-entregue { background: #9C27B0; color: white; padding: 3px 8px; border-radius: 12px; }
        .status-cancelado { background: #f44336; color: white; padding: 3px 8px; border-radius: 12px; }
        
        .filtros {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filtro-btn {
            padding: 8px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .filtro-btn:hover {
            background: #f0f0f0;
        }
        
        .filtro-btn.active {
            background: #C83232;
            color: white;
            border-color: #C83232;
        }
        
        .paginacao {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            align-items: center;
        }
        
        .btn-pagina {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-pagina:hover:not(:disabled) {
            background: #C83232;
            color: white;
            border-color: #C83232;
        }
        
        .btn-pagina:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info-pagina {
            padding: 8px 15px;
            color: #666;
            font-size: 14px;
        }
        
        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        
        th {
            text-align: left;
            padding: 12px;
            background: #f5f5f5;
            color: #333;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>🍽️ Meu Pedido - Painel Administrativo</h1>
        <div class="user-info">
            <span>👤 DL Crepes e Lanches</span>
            <button class="logout" onclick="logout()">🚪 Sair</button>
        </div>
    </div>
    
    <div class="admin-container">
        <div class="admin-sidebar">
            <ul>
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="produtos.html">📦 Produtos</a></li>
                <li><a href="categorias.html">📁 Categorias</a></li>
                <li><a href="pedidos.html" class="active">📋 Pedidos</a></li>
                <li><a href="config.html">⚙️ Configurações</a></li>
                <li><a href="complementos.html">🧩 Complementos</a></li>
            </ul>
        </div>
        
        <div class="admin-content">
            <h1>📋 Pedidos</h1>
            
            <div class="filtros" id="filtros">
                <button class="filtro-btn active" onclick="filtrarPedidos('todos')">Todos</button>
                <button class="filtro-btn" onclick="filtrarPedidos('novo')">🆕 Novos</button>
                <button class="filtro-btn" onclick="filtrarPedidos('preparando')">👨‍🍳 Preparando</button>
                <button class="filtro-btn" onclick="filtrarPedidos('pronto')">✅ Pronto</button>
                <button class="filtro-btn" onclick="filtrarPedidos('entregue')">🚚 Entregue</button>
                <button class="filtro-btn" onclick="filtrarPedidos('cancelado')">❌ Cancelado</button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>Telefone</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pedidosTable">
                        <tr><td colspan="7"><div class="loading">Carregando pedidos...</div></td></tr>
                    </tbody>
                </table>
                
                <div class="paginacao" id="paginacao" style="display: none;">
                    <button class="btn-pagina" onclick="mudarPagina('anterior')" id="btnAnterior" disabled>← Anterior</button>
                    <span class="info-pagina" id="infoPagina">Página 1 de 1</span>
                    <button class="btn-pagina" onclick="mudarPagina('proxima')" id="btnProxima">Próxima →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://meu-pedido-backend.onrender.com/api';
        const SUBDOMINIO = 'dlcrepes';
        const ITENS_POR_PAGINA = 10; // ALTERADO PARA 10
        
        let todosPedidos = [];
        let pedidosFiltrados = [];
        let paginaAtual = 1;
        let filtroAtual = 'todos';

        // Verificar login
        if (!localStorage.getItem('adminLogado')) {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('adminLogado');
            window.location.href = 'index.html';
        }

        // ===== CARREGAR PEDIDOS =====
        async function carregarPedidos() {
            try {
                console.log('🔄 Carregando pedidos...');
                
                const response = await fetch(`${API_URL}/pedidos/${SUBDOMINIO}`);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                todosPedidos = await response.json();
                console.log(`✅ ${todosPedidos.length} pedidos carregados`);
                
                aplicarFiltro();
                
            } catch (error) {
                console.error('❌ Erro ao carregar pedidos:', error);
                document.getElementById('pedidosTable').innerHTML = `
                    <tr><td colspan="7" style="color:red; text-align:center; padding:40px;">
                        ❌ Erro ao carregar pedidos: ${error.message}<br>
                        <button onclick="carregarPedidos()" style="margin-top:20px; padding:10px 20px; background:#C83232; color:white; border:none; border-radius:5px; cursor:pointer;">
                            🔄 Tentar novamente
                        </button>
                    </td></tr>
                `;
                document.getElementById('paginacao').style.display = 'none';
            }
        }

        // ===== FILTRAR PEDIDOS =====
        function filtrarPedidos(filtro) {
            filtroAtual = filtro;
            paginaAtual = 1;
            
            // Atualizar classe active nos botões
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            aplicarFiltro();
        }

        function aplicarFiltro() {
            console.log('🔍 Filtrando por:', filtroAtual);
            
            if (filtroAtual === 'todos') {
                pedidosFiltrados = [...todosPedidos];
            } else {
                pedidosFiltrados = todosPedidos.filter(p => p.status === filtroAtual);
            }
            
            console.log(`📊 ${pedidosFiltrados.length} pedidos após filtro`);
            
            paginaAtual = 1;
            
            if (pedidosFiltrados.length === 0) {
                document.getElementById('pedidosTable').innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">Nenhum pedido encontrado</td></tr>';
                document.getElementById('paginacao').style.display = 'none';
                return;
            }
            
            exibirPaginaAtual();
        }

        // ===== PAGINAÇÃO =====
        function exibirPaginaAtual() {
            const tbody = document.getElementById('pedidosTable');
            const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
            const fim = inicio + ITENS_POR_PAGINA;
            const pedidosPagina = pedidosFiltrados.slice(inicio, fim);
            
            const totalPaginas = Math.ceil(pedidosFiltrados.length / ITENS_POR_PAGINA);
            
            // Mostrar/esconder paginação
            if (totalPaginas > 1) {
                document.getElementById('paginacao').style.display = 'flex';
            } else {
                document.getElementById('paginacao').style.display = 'none';
            }
            
            document.getElementById('infoPagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('btnAnterior').disabled = paginaAtual === 1;
            document.getElementById('btnProxima').disabled = paginaAtual === totalPaginas;
            
            tbody.innerHTML = pedidosPagina.map(p => {
                const data = new Date(p.data_pedido).toLocaleString('pt-BR');
                return `
                    <tr>
                        <td><strong>#${p.id}</strong></td>
                        <td>${p.cliente_nome}</td>
                        <td>${p.cliente_telefone}</td>
                        <td><strong style="color:#C83232">R$ ${parseFloat(p.total).toFixed(2)}</strong></td>
                        <td><span class="status-${p.status}">${p.status}</span></td>
                        <td>${data}</td>
                        <td>
                            <a href="pedido-detalhe.html?id=${p.id}" class="btn-view">👁️ Detalhes</a>
                            <select class="status-select" onchange="atualizarStatus(${p.id}, this.value)">
                                <option value="novo" ${p.status === 'novo' ? 'selected' : ''}>Novo</option>
                                <option value="preparando" ${p.status === 'preparando' ? 'selected' : ''}>Preparando</option>
                                <option value="pronto" ${p.status === 'pronto' ? 'selected' : ''}>Pronto</option>
                                <option value="entregue" ${p.status === 'entregue' ? 'selected' : ''}>Entregue</option>
                                <option value="cancelado" ${p.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function mudarPagina(direcao) {
            const totalPaginas = Math.ceil(pedidosFiltrados.length / ITENS_POR_PAGINA);
            
            if (direcao === 'proxima' && paginaAtual < totalPaginas) {
                paginaAtual++;
            } else if (direcao === 'anterior' && paginaAtual > 1) {
                paginaAtual--;
            } else {
                return;
            }
            
            exibirPaginaAtual();
        }

        // ===== ATUALIZAR STATUS =====
        async function atualizarStatus(pedidoId, novoStatus) {
            try {
                const response = await fetch(`${API_URL}/pedidos/${SUBDOMINIO}/${pedidoId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });
                
                if (response.ok) {
                    // Recarregar para atualizar a lista
                    await carregarPedidos();
                } else {
                    alert('Erro ao atualizar status');
                }
            } catch (error) {
                alert('Erro de conexão');
            }
        }

        // Iniciar
        carregarPedidos();
        setInterval(carregarPedidos, 30000);
    </script>
</body>
</html>
