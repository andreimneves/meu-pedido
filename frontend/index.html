<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cardápio Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header" id="header">
            <div class="logo-area" id="logoArea">
                <span id="logoPlaceholder">🍽️</span>
                <img id="logoImagem" src="" alt="Logo" style="display: none;">
            </div>
            
            <div class="header-info">
                <h1 id="nomeLoja">Carregando...</h1>
                <div class="slogan" id="slogan"></div>
                
                <div class="header-details" id="headerDetails">
                    <span id="horario">🕒 Carregando...</span>
                    <span id="endereco">📍 Carregando...</span>
                </div>
            </div>
            
            <div class="cart-icon" onclick="abrirCarrinho()">
                🛒 <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>

        <div id="mensagemPersonalizada" class="mensagem-personalizada" style="display: none;"></div>

        <div class="suporte-whatsapp" id="suporteWhatsapp" onclick="abrirWhatsappSuporte()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            <span>Dúvidas? Conte com a gente!</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar no cardápio..." onkeyup="filtrarProdutos()">
        </div>

        <div class="categorias" id="categorias">
            <button class="categoria-btn ativa" onclick="filtrarCategoria('Todos')">Todos</button>
        </div>

        <div class="produtos" id="produtos">
            <div class="loading">Carregando cardápio...</div>
        </div>

        <div style="height: 80px;"></div> 
        
        <div class="rodape-carrinho" id="rodapeCarrinho" onclick="abrirCarrinho()">
            <div class="rodape-info">
                <span class="rodape-qtd" id="rodapeQtd">0</span> itens no carrinho
            </div>
            <div class="rodape-total">Ver carrinho <span>R$ <span id="rodapeTotal">0,00</span></span></div>
        </div>
    </div>

    <div id="produtoDetalheModal" class="modal bottom-sheet">
        <div class="modal-content detalhe-content">
            <div class="modal-header-sticky">
                <h2 id="detalheNome">Nome do Produto</h2>
                <span class="close-bottom" onclick="fecharDetalheProduto()">&times;</span>
            </div>
            
            <div class="detalhe-scroll">
                <div id="detalheImagemContainer" style="display:none; width: 100%; height: 200px; background: #f5f5f5; border-radius: 8px; margin-bottom: 15px; overflow: hidden;">
                    <img id="detalheImagem" src="" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <p id="detalheDescricao" style="color: #666; font-size: 14px; margin-bottom: 10px;"></p>
                <h3 style="color: #C83232; margin-bottom: 20px;">R$ <span id="detalhePrecoBase">0,00</span></h3>

                <div id="detalheComplementos">
                    <div class="loading">Carregando opções...</div>
                </div>
                
                <div class="form-row" style="margin-top: 20px;">
                    <label>Alguma observação?</label>
                    <textarea id="detalheObservacao" rows="2" placeholder="Ex: Tirar cebola, ponto da carne..."></textarea>
                </div>
            </div>

            <div class="detalhe-footer">
                <div class="quantidade-controle">
                    <button type="button" class="btn-qtd" onclick="alterarQuantidadeDetalhe(-1)">-</button>
                    <span id="detalheQuantidade">1</span>
                    <button type="button" class="btn-qtd" onclick="alterarQuantidadeDetalhe(1)">+</button>
                </div>
                <button class="btn-adicionar-final" onclick="adicionarProdutoPersonalizadoAoCarrinho()">
                    Adicionar • R$ <span id="detalhePrecoTotal">0,00</span>
                </button>
            </div>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharCarrinho()">&times;</span>
            <h2>🛒 Seu Pedido</h2>
            
            <div class="cart-items" id="cartItems"></div>
            
            <div class="cart-total">
                <span>Subtotal:</span> <strong>R$ <span id="cartSubtotal">0,00</span></strong>
            </div>

            <div class="form-section">
                <h3>📋 Dados de Entrega</h3>
                <div class="delivery-options">
                    <input type="radio" name="deliveryType" value="delivery" id="deliveryOption" onchange="toggleDelivery(true)">
                    <label for="deliveryOption">🚚 Delivery</label>
                    
                    <input type="radio" name="deliveryType" value="pickup" id="pickupOption" onchange="toggleDelivery(false)" checked>
                    <label for="pickupOption">🏠 Retirada</label>
                </div>

                <div id="deliveryFields" style="display: none;">
                    <div class="form-row">
                        <label>👤 Nome completo *</label>
                        <input type="text" id="clienteNome" placeholder="Seu nome">
                    </div>
                    <div class="form-row">
                        <label>📱 WhatsApp *</label>
                        <input type="tel" id="clienteTelefone" placeholder="(DDD) 99999-9999">
                    </div>
                    <div class="form-row">
                        <label>📍 CEP *</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="cepInput" placeholder="00000-000" style="flex: 2;" oninput="mascaraCEP(this)">
                            <button type="button" onclick="calcularFretePorCEP()" style="flex: 1; background: #C83232; color: white; border: none; border-radius: 8px;">Calcular</button>
                        </div>
                        <div class="cep-info" id="cepInfo"></div>
                    </div>
                    <div class="address-grid">
                        <div class="form-row" style="grid-column: 1/-1;">
                            <label>🏠 Endereço *</label>
                            <input type="text" id="clienteEndereco" placeholder="Rua, Avenida...">
                        </div>
                        <div class="form-row">
                            <label>Número *</label>
                            <input type="text" id="clienteNumero" placeholder="123">
                        </div>
                        <div class="form-row">
                            <label>Bairro *</label>
                            <input type="text" id="clienteBairro" placeholder="Seu bairro" readonly style="background: #f0f0f0;">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>📍 Complemento</label>
                        <input type="text" id="clienteComplemento" placeholder="Apto, Bloco...">
                    </div>
                    <div class="frete-info" id="freteInfo">👆 Informe seu CEP</div>
                </div>

                <div id="pickupFields">
                    <div class="form-row">
                        <label>👤 Nome completo *</label>
                        <input type="text" id="pickupNome" placeholder="Seu nome">
                    </div>
                    <div class="form-row">
                        <label>📱 WhatsApp *</label>
                        <input type="tel" id="pickupTelefone" placeholder="(DDD) 99999-9999">
                    </div>
                </div>
                
                <div class="cart-total" style="margin-top: 15px; font-size: 18px; border-top: 2px solid #ddd; padding-top: 15px;">
                    <span>TOTAL GERAL:</span> <strong style="font-size: 22px;">R$ <span id="cartTotalFinal">0,00</span></strong>
                </div>
            </div>

            <button class="whatsapp-btn" onclick="finalizarPedido()">📲 Enviar Pedido via WhatsApp</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
