<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header class="loja-header">
        <div class="logo-container">
            <img id="logoImagem" src="" alt="Logo" style="display: none;">
            <div id="logoPlaceholder" class="logo-placeholder">🍔</div>
        </div>
        <h1 id="nomeLoja">Carregando Loja...</h1>
        <p id="slogan" class="slogan"></p>
        <div class="loja-info">
            <span id="endereco">📍 ...</span><br>
            <span id="horario">🕒 ...</span>
        </div>
    </header>

    <div id="mensagemPersonalizada" class="mensagem-banner" style="display: none;"></div>

    <main class="container">
        <div class="busca-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar produtos..." onkeyup="filtrarProdutos()">
        </div>
        <div class="categorias-container" id="categorias"></div>

        <div id="produtos" class="produtos-grid">
            <div class="loading">Carregando cardápio...</div>
        </div>
    </main>

    <div id="rodapeCarrinho" class="rodape-carrinho" style="display: none;" onclick="abrirCarrinho()">
        <div class="rodape-info">
            <span class="carrinho-icone">🛒 <span id="cartCount" class="badge">0</span></span>
            <span>Ver Carrinho</span>
        </div>
        <div class="rodape-total">R$ <span id="rodapeTotal">0.00</span></div>
    </div>

    <div id="produtoDetalheModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharDetalheProduto()">&times;</button>
            <div id="detalheImagemContainer" style="display:none; text-align: center; margin-bottom: 15px;">
                <img id="detalheImagem" src="" style="max-width: 100%; height: 200px; object-fit: cover; border-radius: 8px;">
            </div>
            <h2 id="detalheNome">Nome</h2>
            <p id="detalheDescricao" class="text-muted"></p>
            <div class="preco-destaque">A partir de R$ <span id="detalhePrecoBase">0.00</span></div>

            <div id="detalheComplementos" class="complementos-container"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Alguma observação?</label>
                <textarea id="detalheObservacao" rows="2" placeholder="Ex: Tirar cebola, ponto da carne..."></textarea>
            </div>

            <div class="modal-footer-acoes">
                <div class="controle-quantidade">
                    <button onclick="alterarQuantidadeDetalhe(-1)">-</button>
                    <span id="detalheQuantidade">1</span>
                    <button onclick="alterarQuantidadeDetalhe(1)">+</button>
                </div>
                <button class="btn-adicionar-final" onclick="adicionarProdutoPersonalizadoAoCarrinho()">
                    Adicionar R$ <span id="detalhePrecoTotal">0.00</span>
                </button>
            </div>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content cart-modal-content">
            <button class="close-btn" onclick="fecharCarrinho()">&times;</button>
            <h2>🛒 Seu Pedido</h2>
            
            <div id="cartItems" class="cart-items-list"></div>

            <div class="checkout-opcoes">
                <h3>Quando deseja receber?</h3>
                <div class="radio-group">
                    <label><input type="radio" name="tipo_tempo" id="tempoAgora" value="agora" checked onchange="toggleAgendamento()"> O mais rápido possível</label>
                    <label><input type="radio" name="tipo_tempo" id="tempoAgendado" value="agendado" onchange="toggleAgendamento()"> Agendar para depois</label>
                </div>
                
                <div id="agendamentoFields" style="display:none; margin-top:10px; background:#fff; padding:10px; border-radius:5px; border:1px solid #ddd;">
                    <label>Data e Hora do Agendamento:</label>
                    <input type="datetime-local" id="dataAgendamento" class="form-control" style="width:100%;">
                </div>

                <h3 style="margin-top:20px;">Como deseja receber?</h3>
                <div class="radio-group">
                    <label><input type="radio" name="tipo_entrega" id="deliveryOption" value="delivery" checked onchange="toggleDelivery()"> 🛵 Delivery</label>
                    <label><input type="radio" name="tipo_entrega" id="pickupOption" value="retirada" onchange="toggleDelivery()"> 🏪 Retirar na Loja</label>
                </div>

                <div id="deliveryFields">
                    <div class="form-group">
                        <label>CEP (Apenas números)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="cepInput" onkeyup="mascaraCEP(this)" maxlength="9" placeholder="00000-000">
                            <button class="btn-secundario" onclick="calcularFretePorCEP()" style="width: auto;">Buscar</button>
                        </div>
                        <small id="cepInfo" style="color:#666;"></small>
                    </div>
                    <div class="form-group">
                        <label>Endereço e Número</label>
                        <input type="text" id="clienteEndereco" placeholder="Ex: Rua das Flores, 123">
                    </div>
                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" id="clienteBairro">
                    </div>
                </div>

                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" id="clienteNome" placeholder="Como podemos te chamar?">
                </div>
                <div class="form-group">
                    <label>Telefone (WhatsApp)</label>
                    <input type="text" id="clienteTelefone" placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <select id="formaPagamento">
                        <option value="pix">PIX (Chave enviada no fim)</option>
                        <option value="cartao_maquininha">Cartão na entrega</option>
                        <option value="dinheiro">Dinheiro</option>
                    </select>
                </div>
            </div>

            <div class="resumo-valores">
                <div class="linha-valor">Subtotal: <span>R$ <span id="cartSubtotal">0.00</span></span></div>
                <div class="linha-valor" id="freteInfoBox">Frete: <span id="freteInfo" style="padding: 2px 5px; border-radius: 4px;">R$ 0.00</span></div>
                <div class="linha-valor total">Total: <span>R$ <span id="cartTotalFinal">0.00</span></span></div>
            </div>

            <button class="btn-finalizar" onclick="processarCheckout()">✅ Finalizar Pedido</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
